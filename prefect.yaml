# How Prefect Cloud gets and runs this project's code.
name: my_pipeline

# Before every run, Prefect clones the repository and moves into src/,
# so that `import my_pipeline` works.
pull:
  - prefect.deployments.steps.git_clone:
      id: clone
      repository: https://github.com/gideoncobbina/my_pipeline.git
      branch: main
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ clone.directory }}/src"

deployments:
  - name: hello
    entrypoint: my_pipeline/hello.py:hello_pipeline
    parameters:
      name: Prefect Cloud
    work_pool:
      name: my-managed-pool
      schedules:
      - cron: "0 9 * * 1-5"
        timezone: Africa/Accra
  - name: plan
    entrypoint: my_pipeline/plan_sketch.py:hello_pipeline
    parameters:
      name: Prefect Cloud
    work_pool:
      name: my-managed-pool
      schedules:
      - cron: "0 9 * * 1-5"
        timezone: Africa/Accra

